name: Job Engine

on:
  schedule:
    # Runs at the top of every hour (UTC). Add/adjust cron lines if you want a different cadence.
    - cron: "0 * * * *"
  workflow_dispatch: {} # lets you trigger it manually from the Actions tab

permissions:
  contents: write # needed to commit the updated data/jobs-seen.json back to the repo

jobs:
  run-job-engine:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install

      - name: Run job engine
        env:
          WP_URL: ${{ secrets.WP_URL }}
          WP_USER: ${{ secrets.WP_USER }}
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
        run: npm start

      - name: Commit updated job store
        run: |
          git config user.name "job-engine-bot"
          git config user.email "job-engine-bot@users.noreply.github.com"
          git add data/jobs-seen.json
          git diff --staged --quiet || git commit -m "chore: update job store [skip ci]"
          git push
